# Netlify site for the internal admin panel: set Base directory = admin
# and the env vars from admin/.env.example (DATABASE_URL, DIRECT_URL, NEXTAUTH_SECRET,
# NEXTAUTH_URL = this site's own URL, GOOGLE_CLIENT_ID/SECRET, ADMIN_EMAIL_ALLOWLIST).
[build]
  command = "npm run build"

[build.environment]
  # Not actual secrets (a public URL and an email allowlist) — they just happen to
  # match .env.example/README text, which trips Netlify's generic secrets scanner.
  SECRETS_SCAN_OMIT_KEYS = "NEXTAUTH_URL,ADMIN_EMAIL_ALLOWLIST"

[[plugins]]
  package = "@netlify/plugin-nextjs"
