# Netlify site for the real frontend: set Base directory = meraki-frontend
# and the env var VITE_API_BASE_URL = https://<your-api-host>/api/v1
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for every route (e.g. /manager/students)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
