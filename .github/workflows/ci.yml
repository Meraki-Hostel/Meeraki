name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meraki
          POSTGRES_PASSWORD: meraki
          POSTGRES_DB: meraki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meraki -d meraki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway database inside the CI runner. Never a real/shared database.
      TEST_DATABASE_URL: postgresql://meraki:meraki@localhost:5432/meraki_test
      DATABASE_URL: postgresql://meraki:meraki@localhost:5432/meraki_test
      DIRECT_URL: postgresql://meraki:meraki@localhost:5432/meraki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Migrations match the schema (no drift)
        run: |
          psql "postgresql://meraki:meraki@localhost:5432/meraki_test" -c "CREATE DATABASE meraki_shadow;"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://meraki:meraki@localhost:5432/meraki_shadow --exit-code
      - name: Run tests
        run: npm test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: meraki-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meraki-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:4000/api/v1
      - name: Check bundle has no mock code
        run: npm run check:bundle
