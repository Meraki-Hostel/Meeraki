name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meraki
          POSTGRES_PASSWORD: meraki
          POSTGRES_DB: meraki_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U meraki -d meraki_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://meraki:meraki@127.0.0.1:55432/meraki_test
      DIRECT_URL: postgresql://meraki:meraki@127.0.0.1:55432/meraki_test
      TEST_DATABASE_URL: postgresql://meraki:meraki@127.0.0.1:55432/meraki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Migrations match the schema (no drift)
        run: |
          psql "postgresql://meraki:meraki@127.0.0.1:55432/meraki_test" -c "CREATE DATABASE meraki_shadow;"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://meraki:meraki@127.0.0.1:55432/meraki_shadow --exit-code
      - run: npm run test:strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meraki-frontend
    env:
      VITE_API_BASE_URL: https://api.example.test/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meraki-frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx eslint src --max-warnings 0
      - run: npm run build
