# Local development database for the Meraki API.
#   docker compose up -d db      start (data persists in the meraki_db volume)
#   docker compose down          stop (data kept)
#   docker compose down -v       stop and DELETE all local data
# Listens on 127.0.0.1 only. The credentials are for this local container, never production.
services:
  db:
    image: postgres:16-alpine
    container_name: meraki-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meraki
      POSTGRES_PASSWORD: meraki_local_dev
      POSTGRES_DB: meraki_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - meraki_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meraki -d meraki_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  meraki_db:
