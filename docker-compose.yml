# Local development database for the StayPookie API.
#   docker compose up -d db      start (data persists in the staypookie_db volume)
#   docker compose down          stop (data kept)
#   docker compose down -v       stop and DELETE all local data
# Listens on 127.0.0.1 only. The credentials are for this local container, never production.
services:
  db:
    image: postgres:16-alpine
    container_name: staypookie-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: staypookie
      POSTGRES_PASSWORD: staypookie_local_dev
      POSTGRES_DB: staypookie_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - staypookie_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staypookie -d staypookie_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  staypookie_db:
